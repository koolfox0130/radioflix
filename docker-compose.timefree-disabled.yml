# Gate-OFF production topology candidate. NOT deployed by implementation/tests.
# Combine only with docker-compose.yml and docker-compose.rfriends.yml after a
# separately reviewed backend recreation plan. No capture bridge is approved.
services:
  backend:
    group_add:
      - "20000"
    environment:
      RADIOFLIX_TIMEFREE_SOCKET: /run/timefree/control.sock
      RFRIENDS_ENABLE_WRITES: "0"
      RADIOFLIX_TIMEFREE_ENABLE_WRITES: "0"
    volumes:
      - type: volume
        source: radioflix-timefree-control
        target: /run/timefree
        read_only: true
      - type: bind
        source: /volume1/@home/kool-fox/radiko_public/radioflix-timefree
        target: /timefree
        read_only: true
        bind:
          create_host_path: false

  rfriends-gateway:
    environment:
      RFRIENDS_ENABLE_WRITES: "0"

  timefree-worker:
    build: ./backend
    image: radioflix-timefree-worker:review
    command: ["python", "-m", "radioflix.timefree.control"]
    restart: unless-stopped
    user: "10001:20000"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      RADIOFLIX_DB_PATH: /data/radioflix.sqlite3
      RADIOFLIX_TIMEFREE_ROOT: /timefree
      RADIOFLIX_TIMEFREE_SOCKET: /run/timefree/control.sock
      RADIOFLIX_TIMEFREE_BOOT_MODE: disabled
      RFRIENDS_ENABLE_WRITES: "0"
      RADIOFLIX_TIMEFREE_ENABLE_WRITES: "0"
    volumes:
      - type: volume
        source: radioflix-reservations
        target: /data
        read_only: true
      - radioflix-timefree-control:/run/timefree
      - type: bind
        source: /home/kool-fox/Share/Radio/rfriends3/data/rsv
        target: /native-reservations
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /volume1/@home/kool-fox/radiko_public/radiko
        target: /recordings
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /volume1/@home/kool-fox/radiko_public/timefree
        target: /native-timefree
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /volume1/@home/kool-fox/radiko_public/radioflix-timefree
        target: /timefree
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid

volumes:
  radioflix-timefree-control:
